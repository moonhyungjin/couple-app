<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>우리 둘만의 집 · 부부 다이어리</title>
  <meta name="theme-color" content="#e05d44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="우리둘집">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="loginPanel" class="login-panel auth-panel" aria-labelledby="welcomeTitle">
    <div class="auth-brand">
      <span class="auth-brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="m5 14 11-9 11 9v12H5Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M16 23s-6-3.2-6-6.3c0-3.1 4.1-4.1 6-1.4 1.9-2.7 6-1.7 6 1.4C22 19.8 16 23 16 23Z" fill="currentColor"/></svg></span>
      <span>우리 둘만의 집</span>
    </div>
    <header class="auth-welcome">
      <div class="auth-house" aria-hidden="true">
        <span class="auth-spark auth-spark-one">✦</span><span class="auth-spark auth-spark-two">♡</span>
        <svg viewBox="0 0 120 110" fill="none"><ellipse cx="60" cy="98" rx="39" ry="5" fill="#E7CFC0" opacity=".5"/><path d="M30 45h60v47a5 5 0 0 1-5 5H35a5 5 0 0 1-5-5Z" fill="#FFFDF9" stroke="#DDB49E" stroke-width="2"/><path d="m20 49 35-31a8 8 0 0 1 10 0l35 31" stroke="#D9765C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M81 30V16h10v23" fill="#D9765C"/><path d="M48 97V72a12 12 0 0 1 24 0v25" fill="#E6AD8C"/><circle cx="66" cy="83" r="2" fill="#A26650"/><path d="M60 54s-10-5.7-10-11c0-5 7-7 10-2.5 3-4.5 10-2.5 10 2.5 0 5.3-10 11-10 11Z" fill="#E38273"/><path d="M22 94h14m47 0h14" stroke="#B2B99A" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <h1 id="welcomeTitle">오늘도, 우리 집에<br>잘 왔어요.</h1>
      <p>별일 없는 하루도 특별해지는<br>우리 둘만의 작은 공간.</p>
    </header>
    <div class="auth-card">
      <div class="auth-card-heading"><span class="auth-eyebrow">OUR LITTLE HOME</span><h2 id="authFormTitle">우리의 하루를 이어볼까요?</h2></div>
      <div class="auth-modes" aria-label="계정 시작 방법">
        <button type="button" class="btn" id="showLogin" aria-pressed="true">로그인</button>
        <button type="button" class="btn" id="showSignup" aria-pressed="false">회원가입</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label><span>이메일</span><span class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input type="email" name="email" autocomplete="username" inputmode="email" placeholder="이메일 주소를 입력해 주세요" required></span></label>
        <label><span>비밀번호</span><span class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg><input type="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" maxlength="128" required></span></label>
        <label id="passwordConfirmLabel" hidden><span>비밀번호 확인</span><span class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-7 5 2 2 4-4"/></svg><input type="password" name="passwordConfirm" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해 주세요" maxlength="128"></span></label>
        <button class="btn auth-submit" id="loginSubmit" type="submit">로그인</button>
      </form>
      <p id="loginMessage" class="auth-message" role="status">로그인 확인 중…</p>
    </div>
    <footer class="auth-footer"><span aria-hidden="true">♡</span><p>계정은 각자, 공간은 함께.<br><span>가입 후 배우자와 연결해 함께 기록해요.</span></p></footer>
  </section>
  <section id="pairPanel" class="login-panel connection-panel" hidden>
    <h1>우리 부부 연결하기 ❤️</h1>
    <p>한 사람이 공간을 만들고, 배우자는 초대 코드를 받아 참여해요.</p>
    <div id="pairChoices">
      <form id="createSpaceForm">
        <h2>새 부부 공간 만들기</h2>
        <label>공간 이름<input type="text" name="name" maxlength="40" value="우리 둘만의 집" required></label>
        <label>내 역할<select name="role" required><option value="">내 역할을 선택해 주세요</option><option value="husband">남편</option><option value="wife">아내</option></select></label>
        <button type="submit" class="btn">공간 만들고 배우자 초대하기</button>
      </form>
      <div class="pair-divider">배우자가 이미 만들었다면</div>
      <form id="pairAcceptForm">
        <label>배우자의 초대 코드<input type="text" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="배우자가 만든 코드를 입력해 주세요" required></label>
        <button type="submit" class="btn">배우자로 연결하기</button>
      </form>
    </div>
    <div id="pairWaiting" hidden>
      <h2 id="pairSpaceName"></h2>
      <p id="pairRoleLabel"></p>
      <button type="button" class="btn secondary" id="createPairInvite">새 초대 코드 만들기</button>
      <div id="pairInvite" hidden>
      <p>배우자에게 아래 코드를 전달해 주세요. 15분 동안 한 번 사용할 수 있어요.</p>
      <output id="pairInviteCode" aria-label="배우자 초대 코드"></output>
      <p id="pairInviteExpiry"></p>
      <button type="button" class="btn secondary" id="copyPairInvite">코드 복사</button>
      </div>
    </div>
    <p id="pairMessage" role="status"></p>
    <button type="button" class="btn secondary" id="pairLogoutBtn">다른 계정으로 로그인</button>
  </section>
  <dialog id="profilePhotoDialog" class="profile-photo-dialog" aria-labelledby="profilePhotoTitle">
    <div class="profile-photo-heading"><h2 id="profilePhotoTitle">프로필 사진</h2><button type="button" class="icon-btn" id="closeProfilePhoto" aria-label="사진 닫기">✕</button></div>
    <div id="profilePhotoContent"></div>
  </dialog>
  <div class="app-shell" hidden>
    <!-- 상단: 로그인 계정 및 실시간 동기화 상태 -->
    <header class="top-bar">
      <div class="role-switch" id="accountIdentity" aria-label="로그인한 계정"></div>
      <div class="top-actions">
        <button type="button" class="btn secondary" id="logoutBtn">로그아웃</button>
        <span class="sync-pill" id="syncStatus"><span class="sync-dot"></span><span id="syncText">로컬 저장됨</span></span>
        <button type="button" class="icon-btn" id="themeBtn" title="다크모드 전환" aria-label="다크모드 전환">🌙</button>
      </div>
    </header>

    <!-- 상단 고정 부부 상태 배너 -->
    <section class="hero-card" id="heroSection"></section>

    <!-- 알림 토스트 (콕 찌르기 / 쿠폰 호출 / 저녁 주문) -->
    <div id="alertSlot"></div>

    <!-- 탭별 메인 컨텐츠 -->
    <main id="mainView" style="display:grid;gap:14px;"></main>
  </div>

  <!-- 하단 5탭 네비게이션 -->
  <nav class="bottom-nav" aria-label="하단 메뉴" hidden>
    <div class="bottom-nav-inner">
      <button type="button" class="nav-tab is-active" data-tab="home">
        <span class="ico">🏠</span><span class="lbl">홈</span>
      </button>
      <button type="button" class="nav-tab" data-tab="quest">
        <span class="ico">⚔️</span><span class="lbl">퀘스트</span>
      </button>
      <button type="button" class="nav-tab" data-tab="cat">
        <span class="ico">🐱</span><span class="lbl">우리냥이</span>
      </button>
      <button type="button" class="nav-tab" data-tab="dinner">
        <span class="ico">🍽️</span><span class="lbl">뭐먹지</span>
      </button>
      <button type="button" class="nav-tab" data-tab="wiki">
        <span class="ico">🗺️</span><span class="lbl">추억도감</span>
      </button>
    </div>
  </nav>

  <script src="./auth.js"></script>
</body>
</html>
